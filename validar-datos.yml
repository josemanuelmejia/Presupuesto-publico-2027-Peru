# Validación automática de las bases en cada cambio.
# Colocar este archivo en .github/workflows/validar-datos.yml
#
# El control comprueba cinco propiedades: que los anexos 5, 6 y 7 cubran conjuntos de
# pliegos disjuntos, que el anexo 8 no exceda en ningún pliego la base que replica, que
# no haya filas idénticas repetidas, que cada pliego propio cierre contra su total
# impreso, y que el catálogo reproduzca los montos de las bases. El flujo informa el
# resultado sin bloquear la publicación, porque algunos pliegos no cierran por cifras
# que el PDF dejó ilegibles y eso está documentado en la propia base, con su diferencia
# exacta en la columna cuadra_el_pliego.

name: Validar bases de asignaciones

on:
  push:
    paths:
      - '*.csv'
      - 'control-asignaciones.py'
  pull_request:
    paths:
      - '*.csv'
  workflow_dispatch:

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar el control sobre cada base
        run: |
          estado=0
          for f in asignaciones-*.csv; do
            echo "=============================================="
            echo "  $f"
            echo "=============================================="
            python3 control-asignaciones.py "$f" || estado=1
          done
          echo "::notice::Control ejecutado sobre todas las bases"
          exit 0

      - name: Verificar que las bases compartan el mismo esquema
        run: |
          python3 - <<'PY'
          import csv, glob, sys
          esquemas = {}
          for f in sorted(glob.glob('asignaciones-*.csv')):
              with open(f, encoding='utf-8-sig') as fh:
                  esquemas[f] = csv.DictReader(fh, delimiter=',').fieldnames
          base = next(iter(esquemas.values()))
          malas = [f for f, c in esquemas.items() if c != base]
          for f, c in esquemas.items():
              print(f'{f}: {len(c)} variables')
          if malas:
              print('Esquemas distintos en:', malas)
              sys.exit(1)
          print('Todas las bases comparten el mismo esquema.')
          PY

      - name: Verificar que el catálogo cuadre con las bases
        run: |
          for f in asignaciones-*.csv; do
            python3 control-asignaciones.py "$f" \
              --catalogo catalogo-pliegos-2027.csv | sed -n '/Correspondencia/,+3p'
          done
